<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="採鮮點貨">
<meta name="theme-color" content="#1D2B22">
<title>採鮮點貨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E7EAE3; --paper:#FFFFFF; --ink:#1D2B22; --muted:#6A746C; --line:#D2D7CE;
  --ok:#2E7A4C; --warn:#C23B2E; --warnbg:#FBE7E4; --low:#D5730A; --lowbg:#FDEBD3; --citrus:#F2C230;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--catbg,var(--bg));color:var(--ink);font-family:var(--sans);font-size:16px;overscroll-behavior:none;transition:background .2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--citrus);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(var(--safe-t) + 10px) 14px 10px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:19px;flex:1;white-space:nowrap}
.date-in{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;color:#fff;font-family:var(--mono);font-size:14px;color-scheme:dark}
.who{background:var(--citrus);color:var(--ink);font-weight:700;border-radius:999px;padding:6px 14px;font-size:15px;min-width:52px;white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;flex:none}
.sync.on{background:#5BD88A}.sync.local{background:var(--citrus)}
.bar{margin-top:10px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--citrus);transition:width .3s}
.bar-txt{display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.8;margin-top:5px}
.bar-txt b{font-family:var(--mono)}
.bar-txt .dn{color:#5BD88A;font-weight:700}

/* ---------- category tabs ---------- */
.tabs{position:sticky;top:var(--tabs-top,108px);z-index:15;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--catbg,var(--bg));scrollbar-width:none;border-bottom:1px solid rgba(0,0,0,.08)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:10px;padding:7px 12px 6px;background:var(--ct);border:1px solid rgba(0,0,0,.08);text-align:left;position:relative;overflow:hidden}
.tab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.tab .t{font-weight:700;font-size:15px;display:block}
.tab .p{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tab .lw{color:var(--low);font-weight:700;margin-left:4px;font-family:var(--sans)}
.tab .rq{color:var(--warn);font-weight:700;margin-left:4px;font-family:var(--sans)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on .p{color:rgba(255,255,255,.7)}.tab.on .lw{color:#FFB65C}.tab.on .rq{color:#FF9D92}
.tab.done .p::after{content:" ✓";color:var(--ok)}.tab.on.done .p::after{color:#5BD88A}

/* ---------- list ---------- */
main{padding:6px 12px calc(84px + var(--safe-b))}
.cat-h{display:flex;align-items:center;gap:8px;margin:14px 2px 8px}
.cat-h h2{margin:0;font-size:20px;font-weight:900}
.cat-h .sw{width:12px;height:12px;border-radius:3px;background:var(--cc)}
.cat-h .act{margin-left:auto;font-size:13px;padding:5px 9px;border:1px solid rgba(0,0,0,.12);border-radius:8px;background:#fff}
.row{display:flex;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:10px 12px;margin-bottom:6px;text-align:left;min-height:60px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden}
.row .nm span.s{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-family:var(--mono);font-weight:700;font-size:24px;text-align:right;line-height:1.1;flex:none;max-width:48%}
.row .val em{font-style:normal;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.row .val.multi{font-size:17px}
.row .dash{color:#BFC5BC;font-size:22px}
.row.set{background:#fff;border-color:rgba(0,0,0,.06);box-shadow:inset 5px 0 0 var(--ok)}.row.set .val{color:var(--ok)}
.row.low{background:#fff;border-color:rgba(0,0,0,.06);box-shadow:inset 5px 0 0 var(--low)}.row.low .val{color:var(--low)}
.row.zero{background:#fff;border-color:rgba(0,0,0,.06);box-shadow:inset 5px 0 0 var(--warn)}.row.zero .val{color:var(--warn);font-family:var(--sans);font-size:18px}
.row.need{border:2px dashed var(--warn);background:rgba(255,255,255,.8)}
.bdg{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;line-height:17px;flex:none}
.bdg.rq{background:var(--warn);color:#fff}
.bdg.lo{background:var(--low);color:#fff}
.diff{font-family:var(--mono);font-size:11px;flex:none}
.up{color:var(--ok)}.dn{color:var(--warn)}

/* ---------- bottom nav ---------- */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bn button{flex:1;padding:10px 0 8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bn button svg{width:22px;height:22px}
nav.bn button.on{color:var(--ink);font-weight:700}
nav.bn button.on svg{stroke:var(--ok)}
nav.bn .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--warn);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}

/* ---------- full-screen keypad ---------- */
.kp{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;height:100vh;height:100dvh;transform:translateY(100%);transition:transform .2s ease-out;visibility:hidden}
.kp.show{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.kp,.bar i,body{transition:none}}
.kp-top{background:var(--kt,var(--bg));padding:calc(var(--safe-t) + 8px) 12px 10px;display:flex;align-items:center;gap:8px}
.kp-top .bk{font-size:15px;font-weight:700;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.7);flex:none}
.kp-top .nm{flex:1;min-width:0}
.kp-top .nm b{display:block;font-size:26px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-top .nm span{font-size:13px;color:var(--muted)}
.kp-top .bdg{font-size:13px;line-height:22px;padding:0 8px}
.kp-body{flex:1;display:flex;flex-direction:column;padding:10px 12px calc(10px + var(--safe-b));gap:8px;min-height:0;max-width:560px;width:100%;margin:0 auto}
.kp-info{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px}
.kp-info div{border-radius:12px;background:var(--bg);padding:7px 10px}
.kp-info small{display:block;font-size:12px;color:var(--muted)}
.kp-info b{font-family:var(--mono);font-size:20px;line-height:1.2}
.kp-info b em{font-style:normal;font-family:var(--sans);font-size:13px;font-weight:500;margin-left:2px}
.kp-info .sf{background:var(--lowbg);border:2px solid #F2C58E}
.kp-info .sf b{color:var(--low);font-size:26px}
.kp-info .sf.none{background:var(--bg);border-color:transparent}
.kp-info .sf.none b{color:#AAB1A8;font-size:16px;font-family:var(--sans)}
.kp-info .cur b{font-size:15px;font-family:var(--sans)}
.kp-units{display:flex;gap:6px}
.kp-units button{flex:1;border:2px solid var(--line);border-radius:10px;padding:6px 4px;font-size:15px;background:var(--paper)}
.kp-units button b{font-family:var(--mono);margin-left:4px}
.kp-units button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.kp-disp{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;background:var(--bg);border-radius:14px;padding:6px 18px;min-height:74px;align-items:center}
.kp-disp .n{font-family:var(--mono);font-weight:700;font-size:52px;line-height:1}
.kp-disp .n.ph{color:#B5BCB3}
.kp-disp .u{font-size:20px;color:var(--muted)}
.kp-warn{min-height:22px;font-size:14px;font-weight:700;text-align:center;border-radius:10px;padding:3px 8px}
.kp-warn.lo{color:var(--low);background:var(--lowbg)}
.kp-warn.bad{color:#fff;background:var(--warn)}
.kp-warn.ok{color:var(--ok)}
.kp-quick{display:grid;grid-template-columns:1.2fr 1.3fr .8fr 1fr;gap:6px}
.kp-quick button{border:1px solid var(--line);border-radius:10px;padding:10px 2px;font-size:14px;font-weight:700;background:var(--paper)}
.kp-quick .z{color:var(--warn);border-color:#EDC0BA;background:var(--warnbg)}
.kp-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;min-height:200px}
.kp-grid button{background:var(--bg);border-radius:14px;font-family:var(--mono);font-size:30px;font-weight:700}
.kp-grid button:active,.kp-quick button:active{filter:brightness(.92)}
.kp-grid .fn{font-family:var(--sans);font-size:22px}
.kp-nav{display:grid;grid-template-columns:1fr 2.2fr;gap:6px}
.kp-nav button{border-radius:14px;padding:16px 0;font-weight:900;font-size:18px}
.kp-nav .pv{background:var(--bg)}
.kp-nav .go{background:var(--ink);color:#fff}
.kp-nav .go.arm{background:var(--warn)}

/* ---------- sheets & panels ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease-out;max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head div{flex:1}.sh-head b{font-size:21px;font-weight:900;display:block}.sh-head span{font-size:13px;color:var(--muted)}
.sh-x{font-size:26px;line-height:1;padding:2px 8px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.pick button{border:2px solid var(--line);border-radius:14px;padding:18px 0;font-size:21px;font-weight:900;background:var(--paper)}
.pick button.on{border-color:var(--ink);background:var(--citrus)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.panel h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.panel h3 .c{font-family:var(--mono);font-size:13px;background:var(--bg);border-radius:6px;padding:1px 7px}
.panel h3 .c.w{background:var(--warnbg);color:var(--warn)}.panel h3 .c.o{background:var(--lowbg);color:var(--low)}
.panel.alert{border:2px solid var(--warn);background:#FFF8F7}
.panel.fin{border:2px solid var(--ok);background:#F2FAF4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:14px;background:var(--paper)}
.chip.w{background:var(--warnbg);border-color:#EDC0BA;color:var(--warn);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--paper);width:100%}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.okb{background:var(--ok);color:#fff;border-color:var(--ok);font-size:17px;padding:14px}
.btn.warn{color:var(--warn);border-color:#EDC0BA}
textarea.note{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.pcat{display:flex;align-items:center;gap:8px;margin:6px 0}
.pcat .nm{width:64px;font-weight:700;font-size:14px}
.pcat .tr{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.pcat .tr i{display:block;height:100%;background:var(--cc)}
.pcat .n{font-family:var(--mono);font-size:12px;width:52px;text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
table.t .r{text-align:right;font-family:var(--mono)}
.hist{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.hist .d{font-family:var(--mono);font-weight:700;font-size:15px;width:108px;flex:none}
.hist .w{flex:1;font-size:13px;color:var(--muted)}
.hist .n{font-family:var(--mono);font-size:13px}
.hist .ck{color:var(--ok);font-weight:900}
.in{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);width:100%}
select.in{appearance:auto}
.ed-head{display:flex;gap:4px;font-size:12px;color:var(--muted);margin:0 0 4px}
.ed-row{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.ed-row input{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);min-width:0}
.ed-row .n{flex:1}.ed-row .u{width:62px;text-align:center}.ed-row .m{width:48px;text-align:center;-moz-appearance:textfield}
.ed-row .m::-webkit-inner-spin-button,.ed-row .m::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ed-row button,.ed-row select{width:32px;height:36px;border-radius:8px;background:var(--bg);font-size:14px;flex:none;border:0}
.ed-row .rqb{font-weight:900;color:#B7BDB5}.ed-row .rqb.on{background:var(--warn);color:#fff}
.ed-row .del{color:var(--warn)}
.diffbox{font-size:14px;line-height:1.7;background:var(--bg);border-radius:10px;padding:10px;margin:10px 0;max-height:260px;overflow:auto}
.diffbox b{font-family:var(--mono)}
.diffbox .a{color:var(--ok)}.diffbox .d{color:var(--warn)}.diffbox .c{color:var(--low)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 4px;text-align:left}
.ph.up{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:80;background:#0c100d;display:flex;flex-direction:column}
.viewer .vb{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 12px 10px;color:#fff}
.viewer .vb .i{flex:1;font-size:14px;opacity:.8}
.viewer .vb button{color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 12px;font-size:14px}
.viewer .vb .del{color:#FF9D92;border-color:rgba(255,157,146,.5)}
.viewer .vi{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding-bottom:var(--safe-b)}
.viewer .vi img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vi img.z{max-width:none;max-height:none;width:200%}
@media (min-width:700px){main,.tabs{max-width:760px;margin:0 auto}.rows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-row">
    <span class="sync" id="sync"></span>
    <div class="brand">採鮮點貨</div>
    <input type="date" class="date-in" id="date" aria-label="日期">
    <button class="who" id="who">選人員</button>
  </div>
  <div class="bar"><i id="barFill" style="width:0"></i></div>
  <div class="bar-txt"><span id="barL"></span><span id="barR"></span></div>
</header>

<div id="vCount"><div class="tabs" id="tabs"></div><main id="list"></main></div>
<main id="vSum" class="hide"></main>
<main id="vHist" class="hide"></main>
<main id="vSet" class="hide"></main>

<nav class="bn" id="nav">
  <button data-v="Count" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>點貨</button>
  <button data-v="Sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>總覽<span class="dot hide" id="navDot"></span></button>
  <button data-v="Hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>紀錄</button>
  <button data-v="Set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
</nav>

<!-- full-screen keypad -->
<section class="kp" id="kp" aria-label="輸入數量">
  <div class="kp-top">
    <button class="bk" id="kpClose">← 清單</button>
    <div class="nm"><b id="kpName"></b><span id="kpSub"></span></div>
    <span class="bdg rq hide" id="kpReq">必點</span>
  </div>
  <div class="kp-body">
    <div class="kp-info">
      <div class="sf" id="kpSafe"><small>安全庫存</small><b id="kpSafeV"></b></div>
      <div><small>上次</small><b id="kpPrevV"></b></div>
      <div class="cur"><small>目前紀錄</small><b id="kpCurV"></b></div>
    </div>
    <div class="kp-units" id="kpUnits"></div>
    <div class="kp-disp"><span class="n" id="kpNum">0</span><span class="u" id="kpUnit"></span></div>
    <div class="kp-warn" id="kpWarn"></div>
    <div class="kp-quick">
      <button class="z" id="kpZero">缺貨</button>
      <button id="kpSame">同上次</button>
      <button data-k="half">½</button>
      <button id="kpClear">清除</button>
    </div>
    <div class="kp-grid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k=".">.</button><button data-k="0">0</button><button class="fn" data-k="bk" aria-label="刪除一位">⌫</button>
    </div>
    <div class="kp-nav"><button class="pv" id="kpPrev">上一項</button><button class="go" id="kpGo">確定・下一項</button></div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="pp" aria-label="選擇清點人員">

/* item units: "箱/斤" → ["箱","斤"] */
const units = i => { const a = String(i.u || "").split(/[\/、,，|]/).map(s => s.trim()).filter(Boolean); return a.length ? a : [""] };

const firstVal = (i, e) => uVal(i, e, units(i)[0]);
const isLow = (i, e) => { if (!e || !minOf(i) || isZero(e)) return false; const v = firstVal(i, e); return v != null && v < minOf(i) };
const needOf = (i, e) => { if (!e || !minOf(i)) return 0; if (isZero(e)) return minOf(i); const v = firstVal(i, e); return v != null && v < minOf(i) ? +(minOf(i) - v).toFixed(2) : 0 };
function qtyText(i, e) {
  if (!e) return "";
  if (isZero(e)) return "缺貨";
  return units(i).map(u => { const v = uVal(i, e, u); return v == null ? null : fmt(v) + u }).filter(Boolean).join(" ");
}
function qtyHtml(i, e) {
  if (isZero(e)) return "缺貨";
  const us = units(i), parts = us.map(u => [u, uVal(i, e, u)]).filter(x => x[1] != null);
  return parts.map(([u, v]) => `${fmt(v)}<em>${esc(u)}</em>`).join(" ");
}

function rowHtml(i, e, pe) {

/* ================= keypad ================= */
function needMe() { if (!S.me) { openPeople(); return true } return false }

  const e = counts()[id], us = units(it), bufs = {}, fresh = {};
  us.forEach(u => { const v = uVal(it, e, u); bufs[u] = v == null ? "" : fmt(v); fresh[u] = true });
  S.kp = { id, us, u: us[0], bufs, fresh, touched: {}, arm: false };

function kpValue(u) { const b = S.kp.bufs[u]; if (b === "" || b === ".") return null; const v = parseFloat(b); return isNaN(v) ? null : v }

  if (pv == null && minOf(it) && u === S.kp.us[0] && v >= minOf(it) * 5 && v >= 10) return `${fmt(v)}${u} 是安全量的 5 倍以上`;
  if (v >= 200) return `${fmt(v)}${u} 數字很大`;

}

  $("#kpUnits").classList.toggle("hide", k.us.length < 2);

function buildEntry(it, vals) {

function lineText() {
  const c = counts(), who = [...new Set(Object.values(c).map(x => x.by).filter(Boolean))].join("、");
  let t = `【採鮮庫存 ${dateLabel(S.date)}】${who ? "清點：" + who : ""}\n`;
  S.cfg.cats.forEach(cat => {
    const its = itemsOf(cat).filter(i => c[i.id] && !isZero(c[i.id]));
    if (its.length) t += `\n▍${cat}\n` + its.map(i => `${i.n} ${qtyText(i, c[i.id])}`).join("、") + "\n";
  });
  const nd = items().filter(i => needOf(i, c[i.id]) > 0);
  if (nd.length) t += `\n📦 需補貨：${nd.map(i => `${i.n} ${fmt(needOf(i, c[i.id]))}${units(i)[0]}`).join("、")}\n`;
  const z = items().filter(i => isZero(c[i.id]));
  if (z.length) t += `\n⚠ 缺貨：${z.map(i => i.n).join("、")}\n`;
  const rq = reqMissing(); if (rq.length) t += `\n❗必點未點：${rq.map(i => i.n).join("、")}\n`;
  const m = items().filter(i => c[i.id] == null && !isReq(i)).length; if (m) t += `\n未點：${m} 項\n`;
  if (S.day && S.day.note) t += `\n備註：${S.day.note}\n`;

}

}

function exportDay() {

      <button class="del" data-a="del" aria-label="刪除">✕</button></div>`).join("")}</div>
    <div class="ed-row" style="margin-top:10px"><input class="n" id="aN" placeholder="新品名"><input class="u" id="aU" placeholder="單位"><input class="m" id="aM" type="number" inputmode="decimal" placeholder="安全"><button id="aAdd" style="width:auto;padding:0 12px;background:var(--ink);color:#fff">新增</button></div>
    <p class="muted" style="margin:8px 0 0">多單位用「/」分開，例如「箱/斤」；安全量以第一個單位計算。</p>
  </div>

  <div class="panel"><h3>安全庫存自動建議</h3>
    <p class="muted" style="margin:0 0 10px">依最近 30 次紀錄，取每項平常庫存（中位數）的一半。只填還沒設定的品項。</p>
    <button class="btn" id="sAuto">自動填入建議值</button></div>

  <div class="grid2"><button class="btn" id="sR">復原</button><button class="btn pri" id="sS">儲存設定</button></div>

  <div class="panel"><h3>連線狀態</h3>
    <p class="muted" style="margin:0">${store.mode === "fb" ? "已連上 Firebase，所有手機即時同步。" : "目前是本機模式，資料只存在這台裝置。要多人同步，請在程式碼最上方填入 Firebase 設定。"}</p>
    <button class="btn warn" id="sDef" style="margin-top:10px">品項還原成原始清單</button></div>`;
  if (S.imp) drawImp();
  const dirty = () => { S.editing = true };
  $("#sC").onchange = e => { dr._cat = e.target.value; drawSet() };
  $("#sP").oninput = e => { dr.people = e.target.value.split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean); dirty() };
  $("#sI").oninput = $("#sI").onchange = e => {
    const r = e.target.closest("[data-id]"), f = e.target.dataset.f; if (!r || !f) return;
    const it = dr.items.find(i => i.id === r.dataset.id);
    if (f === "m") { const v = parseFloat(e.target.value); if (v > 0) it.m = v; else delete it.m }
    else it[f] = e.target.value.trim();
    dirty(); if (f === "c" && e.type === "change") drawSet();
  };
  $("#sI").onclick = e => {
    const b = e.target.closest("[data-a]"); if (!b) return; const id = b.closest("[data-id]").dataset.id;
    const arr = dr.items, idx = arr.findIndex(i => i.id === id), it = arr[idx]; dirty();
    if (b.dataset.a === "rq") { if (it.r) delete it.r; else it.r = 1 }
    else if (b.dataset.a === "del") { if (!confirm(`刪除「${it.n}」？過去的紀錄會保留。`)) return; arr.splice(idx, 1) }
    else if (b.dataset.a === "up") { let k = idx - 1; while (k >= 0 && arr[k].c !== it.c) k--; if (k >= 0) [arr[idx], arr[k]] = [arr[k], arr[idx]] }
    drawSet();
  };
  $("#aAdd").onclick = () => {
    const n = $("#aN").value.trim(); if (!n) return toast("先輸入品名");
    let at = -1; dr.items.forEach((x, k) => { if (x.c === cat) at = k });
    const ni = { id: newId(dr.items), n, u: $("#aU").value.trim(), c: cat }, m = parseFloat($("#aM").value); if (m > 0) ni.m = m;
    dr.items.splice(at + 1, 0, ni); dirty(); drawSet();
  };
  $("#sAuto").onclick = autoSuggest;
  $("#sR").onclick = () => { S.editing = false; S.imp = null; renderSet() };
  $("#sS").onclick = () => saveDraft("設定已儲存");
  $("#sDef").onclick = async () => { if (!confirm("把品項清單還原成原始版本？（人員名單不變，紀錄不受影響）")) return;
    const c = JSON.parse(JSON.stringify(DEFAULT_CFG)); c.people = S.cfg.people; await store.saveCfg(c).catch(err); S.editing = false; renderSet(); toast("已還原") };
  $("#xDown").onclick = downloadItems;
  $("#xUp").onclick = () => { $("#xlIn").value = ""; $("#xlIn").click() };
}
function newId(arr) { const max = arr.reduce((m, i) => Math.max(m, +String(i.id).slice(1) || 0), 0); return "i" + String(max + 1).padStart(3, "0") }
async function saveDraft(msg) {
  const dr = S.draft;
  const cats = dr.cats.filter(c => dr.items.some(i => i.c === c));
  const c = { cats: cats.length ? cats : dr.cats, items: dr.items.filter(i => i.n).map(({ id, n, u, c, m, r }) => { const o = { id, n, u: u || "", c }; if (m > 0) o.m = m; if (r) o.r = 1; return o }), people: dr.people.length ? dr.people : ["土豆"] };
  try { await store.saveCfg(c); S.editing = false; S.imp = null; toast(msg) } catch (e) { err(e) }
}
async function autoSuggest() {
  const ds = await store.listDays(30); if (ds.length < 3) return toast("紀錄少於 3 次，先累積幾天再用");
  let n = 0;
  S.draft.items.forEach(i => { if (minOf(i)) return;
    const vs = ds.map(d => firstVal(i, (d.counts || {})[i.id])).filter(v => v != null && v > 0).sort((a, b) => a - b);
    if (vs.length < 3) return;
    const med = vs.length % 2 ? vs[(vs.length - 1) / 2] : (vs[vs.length / 2 - 1] + vs[vs.length / 2]) / 2;
    i.m = Math.max(.5, Math.ceil(med * .5 * 2) / 2); n++ });
  S.editing = true; drawSet(); toast(n ? `已建議 ${n} 項，確認後按儲存` : "沒有可建議的品項");
}

/* ---------- Excel item import / export ---------- */
function downloadItems() {
  const src = S.draft || S.cfg;
  const rows = [["分類", "品名", "單位", "安全量", "必點"]];
  src.cats.forEach(c => src.items.filter(i => i.c === c).forEach(i => rows.push([i.c, i.n, i.u || "", minOf(i) || "", isReq(i) ? "V" : ""])));
  const help = [["欄位", "怎麼填"], ["分類", "照原本的分類名稱；新分類也可以，會自動加在最後。空白＝跟上一列同分類"], ["品名", "必填。同一品項兩種包裝要分開點，就寫兩列不同品名（例：青江菜(件)、青江菜(捆)）"],
    ["單位", "一種單位：箱。同品項會混著不同單位：箱/斤（點貨時可以同時輸入 2箱 5斤）"], ["安全量", "數字，以第一個單位計。空白＝不追蹤"], ["必點", "填 V（或 是、必、1）＝必點，沒點完不能按完成"],
    ["排序", "表格上下順序就是 App 裡的順序"], ["刪除", "整列刪掉即可，過去的紀錄會保留"]];
  saveWb([["品項", sheetOf(rows, [8, 16, 10, 8, 6])], ["說明", sheetOf(help, [8, 70])]], `品項表_${today()}.xlsx`);
}
const truthy = v => /^(v|y|yes|是|必|1|true|✓|✔|o|ｖ|Ｖ)$/i.test(String(v ?? "").trim());
$("#xlIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    const hi = rows.findIndex(r => r.some(x => String(x).trim() === "品名"));
    if (hi < 0) return toast("找不到「品名」欄，請用下載的品項表修改");
    const h = rows[hi].map(x => String(x).trim()), col = names => h.findIndex(x => names.includes(x));
    const cC = col(["分類"]), cN = col(["品名"]), cU = col(["單位"]), cM = col(["安全量", "安全庫存"]), cR = col(["必點"]);
    const base = S.draft || JSON.parse(JSON.stringify(S.cfg));
    const old = base.items, used = new Set(), out = [], cats = [];
    let lastCat = base.cats[0], idPool = old.slice();
    for (const r of rows.slice(hi + 1)) {
      const n = String(r[cN] ?? "").trim(); if (!n) continue;
      const c = (cC >= 0 && String(r[cC]).trim()) || lastCat; lastCat = c;
      if (!cats.includes(c)) cats.push(c);
      const u = cU >= 0 ? String(r[cU] ?? "").trim() : "";
      const m = cM >= 0 ? parseFloat(r[cM]) : NaN, rq = cR >= 0 && truthy(r[cR]);
      let match = old.find(i => !used.has(i.id) && i.c === c && i.n === n) || old.find(i => !used.has(i.id) && i.n === n);
      const id = match ? match.id : newId([...idPool, ...out]);
      if (match) used.add(match.id);
      const it = { id, n, u, c }; if (m > 0) it.m = m; if (rq) it.r = 1;
      out.push(it);
    }
    if (!out.length) return toast("檔案裡沒有品項");
    const byId = new Map(old.map(i => [i.id, i]));
    const added = out.filter(i => !byId.has(i.id));
    const removed = old.filter(i => !out.some(o => o.id === i.id));
    const changed = out.filter(i => { const o = byId.get(i.id); return o && (o.c !== i.c || (o.u || "") !== i.u || (minOf(o) || 0) !== (minOf(i) || 0) || !!o.r !== !!i.r) });
    S.imp = { items: out, cats, added, removed, changed, byId, people: base.people };
    S.editing = true; drawImp();
    $("#impBox").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (x) { err(x) }
};
function drawImp() {
  const m = S.imp, box = $("#impBox"); if (!box) return;
  const desc = (o, i) => { const d = []; if (o.c !== i.c) d.push(`${o.c}→${i.c}`); if ((o.u || "") !== i.u) d.push(`單位 ${o.u || "—"}→${i.u || "—"}`);
    if ((minOf(o) || 0) !== (minOf(i) || 0)) d.push(`安全 ${minOf(o) || "—"}→${minOf(i) || "—"}`); if (!!o.r !== !!i.r) d.push(i.r ? "設為必點" : "取消必點"); return d.join("，") };
  box.innerHTML = `<div class="diffbox">
    <div>共 <b>${m.items.length}</b> 項，分類 ${m.cats.map(esc).join("、")}</div>
    ${m.added.length ? `<div class="a">新增 ${m.added.length}：${m.added.map(i => esc(i.n + (i.u ? `(${i.u})` : ""))).join("、")}</div>` : ""}
    ${m.changed.length ? `<div class="c">修改 ${m.changed.length}：${m.changed.map(i => `${esc(i.n)}（${esc(desc(m.byId.get(i.id), i))}）`).join("、")}</div>` : ""}
    ${m.removed.length ? `<div class="d">刪除 ${m.removed.length}：${m.removed.map(i => esc(i.n)).join("、")}</div>` : ""}
    ${!m.added.length && !m.changed.length && !m.removed.length ? `<div>內容和目前一樣（可能只調了順序）</div>` : ""}
  </div><div class="grid2"><button class="btn" id="iNo">取消</button><button class="btn pri" id="iOk">套用並儲存</button></div>`;
  $("#iNo").onclick = () => { S.imp = null; box.innerHTML = ""; S.editing = false; renderSet() };
  $("#iOk").onclick = () => { S.draft = { cats: m.cats, items: m.items, people: S.draft ? S.draft.people : m.people }; saveDraft(`已套用 ${m.items.length} 項品項`) };
}
</script>
